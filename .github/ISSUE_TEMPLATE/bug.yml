name: 不具合の報告
description: 動かない・表示が崩れる・記録が消えたなど
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        この内容は**誰でも読める場所に公開されます**。実験の記録の中身や、個人がわかる情報は書かないでください。
  - type: input
    id: device
    attributes:
      label: 端末とブラウザ
      placeholder: 例: iPhone 15 / iOS 19 / Safari(ホーム画面に追加して起動)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: アプリの版
      description: 設定画面のいちばん下に表示されています
  - type: textarea
    id: steps
    attributes:
      label: 何をしたら、どうなったか
      placeholder: |
        1. 実験タブで課題を選んだ
        2. 予想を保存したら真っ白になった
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 本来どうなってほしかったか
